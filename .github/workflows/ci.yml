name: Go Client CI
on: 
  push:
    branches: main
  pull_request: { }
  workflow_dispatch: { }
jobs:
  go-client:
    name: Go client tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go
        shell: bash
        id: build-go
        working-directory: cmd/zbctl
        run: ./build.sh
      - name: Run Go tests
        working-directory: .
        run: go test -mod=vendor -v ./...
  go-lint:
    name: Go linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned: a new release can add default checks; bump deliberately
          version: v2.15.0
          working-directory: .
  go-apidiff:
    if: github.event_name == 'pull_request'
    name: Go Backwards Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: joelanford/go-apidiff@main
