name: Release Go Client
on: 
  push:
    branches:
      - 'release/**'
jobs:
  release:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v7
      - name: Git User Setup
        run: |
          git config --global user.email "github-actions[release]"
          git config --global user.name "github-actions[release]@users.noreply.github.com"
      - name: Get Release version
        shell: bash
        run: |
          RELEASE_VERSION=$(echo $GITHUB_REF | egrep -o "[0-9]\.[0-9]\.[0-9]{1,2}(-.*)?")
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Find previous release tag
        shell: bash
        run: |
          # Release tags sit on release-branch commits that never reach main,
          # so GitHub cannot find the previous tag in the new tag's history and
          # would generate notes for the whole project history. Name it explicitly.
          git fetch --quiet --tags origin
          PREVIOUS_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vx "v${RELEASE_VERSION}" | head -n 1)
          echo "Previous release tag: ${PREVIOUS_TAG:-<none>}"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set and commit Go Client version
        run: |
          pushd internal/embedded
          echo "${RELEASE_VERSION}" > data/VERSION
          git commit -am "build(project): update go embedded version data"
      - name: Run Go Client tests
        working-directory: .
        run: go test -mod=vendor -v ./...
      - name: Build Go Client release artifacts
        shell: bash
        id: build-go
        working-directory: cmd/zbctl
        run: ./build.sh
      - name: Go Post-Release
        run: |
          # Publish Go tag for the release
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
      - name: Create Github release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.RELEASE_VERSION }}
          artifacts: "cmd/zbctl/dist/*"
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ env.PREVIOUS_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.RELEASE_VERSION }}
